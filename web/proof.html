<header class="nav"><div class="wrap"><a class="brand" href="./"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M3 24h26" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M6 19.5l17.5-6.2c1.6-.6 3.3.3 3.8 1.9l.2.6-15.6 5.6-4.4-1.2-3.4-6.6 2.6-.9 4 3.6z" fill="currentColor"/></svg>Landed</a><nav><a href="./#how">How it works</a><a class="btn small" href="demo.html">Try the demo</a></nav></div></header>

  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>When</th><th>Amount</th><th>Paid to</th><th>HSP payment</th><th>Receipt</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="no">Loading…</td></tr></tbody>
  </table></div>
</main>
